[package]
name = "pdf-viewer"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"
description = "A Rust PDF viewer library with WebAssembly support"
repository = "https://github.com/yourusername/pdf-viewer-rust"

[lib]
path = "rust_src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element", 
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
    "CssStyleDeclaration",
    "DomRect",
    "Performance",
    "MouseEvent",
    "SvgElement"
]}
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
thiserror = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true